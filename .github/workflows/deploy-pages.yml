name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, download-build ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Prepare Build
        run: |
          mkdir public
          cp index.html public/
          cp app.js public/
          cp styles.css public/
          cp freemium-styles.css public/
          cp -r assets public/
          cp -r experiments public/
          cp root-test.html public/ || true
          cp -r "фото оборудования" public/ || true
          cp equipment-kits.js public/ || true
          cp labosfera-config.js public/ || true
          cp .nojekyll public/ || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
