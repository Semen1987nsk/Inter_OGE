# CI монорепы. Прежний конвейер (Jest, Playwright e2e, mobile, Electron) мёртв
# относительно текущей структуры: electron-app удалён, e2e-снапшоты сняты на Windows
# и на Linux-раннере дают ложные диффы шрифтов/рендеринга — поэтому здесь только
# typecheck + unit-тесты (vitest, платформонезависимые) и скан секретов.
name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

# Устаревший пуш в ту же ветку не должен дожигать минуты — новый запуск снимает старый.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Токену — минимум: воркфлоу ничего не публикует и не пишет в репозиторий.
permissions:
  contents: read

jobs:
  test:
    # ubuntu-latest: Windows-раннеры биллятся x2, а typecheck и vitest платформонезависимы.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 24 — та же мажорная линия, на которой репозиторий проверяется локально.
          node-version: '24'
          cache: 'npm'

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов (все воркспейсы)
        run: npm run typecheck

      - name: Юнит-тесты (все воркспейсы)
        run: npm test
      # npm run test:e2e здесь намеренно нет: Playwright-снапшоты записаны на Windows
      # и не воспроизводятся на Linux-раннере попиксельно.

  # Репозиторий публичный — утёкший секрет доступен всем сразу, поэтому скан
  # всей истории на каждом пуше, а не только диффа.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Право комментировать PR — иначе экшен не сможет отметить находку в обсуждении.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Полная история: gitleaks сканирует коммиты, а не срез рабочего дерева.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE не задан намеренно: для личных аккаунтов ключ не нужен,
          # он обязателен только для репозиториев организаций.
